# Cache: page + price data always revalidate (so visitors get the newest
# prices), CSS/JS/images cached for an hour.
map $uri $cache_control {
    default             "public, max-age=3600";
    /                   "no-cache";
    /index.html         "no-cache";
    ~^/data/            "no-cache";
    /healthz            "no-store";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;   # behind Cloud Run's HTTPS proxy

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript image/svg+xml;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self)" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # health check for uptime monitoring
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
