name: Update prices

on:
  schedule:
    - cron: "17 1 * * *"   # daily, ~9:17am Malaysia time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow requests
      - run: python scripts/fetch_pricecatcher.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/history.json
          git diff --cached --quiet || git commit -m "Update prices from PriceCatcher"
          git push
