name: Update online prices

on:
  schedule:
    - cron: "43 18 * * *"   # daily, ~2:43am Malaysia time (quiet hours for retailer sites)
  workflow_dispatch:
    inputs:
      only:
        description: "Run just this retailer (name from scripts/retailers.json), for testing"
        required: false
      max_pages:
        description: "Max pages per retailer"
        required: false
        default: "3000"
      diagnose:
        description: "Diagnose only: inspect a few pages per retailer, save them as a run artifact, change nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Diagnose retailer websites
        if: ${{ inputs.diagnose }}
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            python scripts/fetch_online_prices.py --diagnose diagnose --only "${{ inputs.only }}"
          else
            python scripts/fetch_online_prices.py --diagnose diagnose
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.diagnose }}
        with:
          name: retailer-diagnose
          path: diagnose/
          retention-days: 7
      - name: Collect prices from retailer websites
        if: ${{ !inputs.diagnose }}
        env:
          ONLINE_MAX_PAGES: ${{ inputs.max_pages || '3000' }}
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            python scripts/fetch_online_prices.py --only "${{ inputs.only }}"
          else
            python scripts/fetch_online_prices.py
          fi
      - name: Commit if changed
        if: ${{ !inputs.diagnose }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/online.json
          git diff --cached --quiet && exit 0
          git commit -m "Update online prices"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
